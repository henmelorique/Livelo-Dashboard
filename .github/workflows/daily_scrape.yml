name: Coleta diária de pontos Livelo

on:
  schedule:
    # 10:00 UTC = 07:00 no horário de Brasília (sem horário de verão hoje em dia)
    - cron: "0 10 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions" no GitHub

permissions:
  contents: write   # necessário para o job poder dar commit/push no repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar scraper e exportar snapshot
        run: python scripts/run_scrape_and_export.py

      - name: Commitar snapshot atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/livelo_export.json
          git diff --staged --quiet || git commit -m "chore: coleta diária de pontos Livelo ($(date -u +%F))"
          git push

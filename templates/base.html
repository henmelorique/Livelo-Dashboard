<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Painel de Pontos{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<div class="ticker-tape" id="tickerTape"></div>

<header class="topbar">
  <a class="brand" href="{{ url_for('dashboard') }}">
    <span class="brand-mark">◆</span>
    <span class="brand-text">Painel de Pontos <em>· parceiros Livelo</em></span>
  </a>
  <div class="topbar-status" id="topbarStatus">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">carregando…</span>
  </div>
</header>

<main class="page">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <span>Dados extraídos de livelo.com.br/juntar-pontos/todos-os-parceiros · projeto pessoal, sem vínculo com a Livelo.</span>
</footer>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
